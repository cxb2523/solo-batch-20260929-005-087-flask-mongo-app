{% extends "layout.html" %}
{% block body %}
<div class="container">
    <div class="row">
        <div class="col-md-5 mx-md-auto pt-5">
            {% if ok %}
            <h1 class="text-success">{{ heading }}</h1>
            <h2>{{ title }}</h2>
            {% else %}
            <h1 class="text-primary">{{ heading }}</h1>
            <h2>{{ title }}</h2>
            {% endif %}
            <p>{{ detail }}</p>
            <hr class="my-3" />
            <p>Go to the <a href="{{ url_for('login') }}" title="Login">login page</a>.</p>
        </div>
    </div>
</div>
{% endblock %}
